# fly.toml app configuration file generated for hoenn-detective-agency on 2026-11-18T16:20:07+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hoenn-detective-agency'
primary_region = 'sin'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
