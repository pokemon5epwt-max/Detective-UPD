# fly.toml app configuration file generated for detective-upd on 2026-11-23T13:04:32Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'detective-upd'
primary_region = 'ams'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
